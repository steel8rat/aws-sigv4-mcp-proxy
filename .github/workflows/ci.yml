name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node >= 22.18 / 24 run the .ts test files directly (type stripping).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    # The published library targets Node >= 20; make sure it still builds and imports there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify built exports
        run: |
          node --input-type=module -e 'import("./dist/index.js").then((m) => process.exit(m.startSigV4Proxy && m.startStdioProxy ? 0 : 1))'
